<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Marks — David Zachary Creative</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&family=Archivo+Expanded:wght@800;900&family=Archivo:wght@400;500;600&family=Space+Mono&display=swap" rel="stylesheet">
<style>
:root{--ink:#101013;--paper:#f4f2ee;--fog:#8a8a8f;--line:#dedad2;--magenta:#ff0a78;
  --slab:"Archivo Expanded",sans-serif;--serif:"Instrument Serif",Georgia,serif;
  --sans:"Archivo",system-ui,sans-serif;--mono:"Space Mono",monospace;--ease:cubic-bezier(.16,1,.3,1)}
*{margin:0;padding:0;box-sizing:border-box}
html{scroll-behavior:smooth}
body{background:var(--paper);color:var(--ink);font-family:var(--sans);-webkit-font-smoothing:antialiased}
a{color:inherit;text-decoration:none}
.wrap{max-width:1500px;margin:0 auto;padding:0 4vw}

.nav-bar{position:fixed;inset:0 0 auto 0;z-index:100;background:rgba(244,242,238,.82);backdrop-filter:blur(14px);border-bottom:1px solid var(--line)}
.nav-bar .in{display:flex;justify-content:space-between;align-items:center;padding:14px 4vw}
.nav-bar svg{height:22px;color:var(--ink)}
.menu a{font-family:var(--mono);font-size:.64rem;letter-spacing:.14em;text-transform:uppercase;padding:8px 12px;color:var(--magenta);border-radius:999px}

.hero{padding:150px 0 40px}
.k{font-family:var(--mono);font-size:.66rem;letter-spacing:.28em;text-transform:uppercase;color:var(--magenta)}
h1{font-family:var(--slab);font-weight:900;text-transform:uppercase;letter-spacing:-.02em;font-size:clamp(2.4rem,7vw,5.6rem);line-height:1;margin-top:12px}
.tone{font-family:var(--serif);font-style:italic;font-size:clamp(1.1rem,2vw,1.5rem);color:#666;margin-top:14px;max-width:52ch}

/* MARKS wall — interactive hi-res (7650×4950 master) */
.marks-grid{display:grid;grid-template-columns:repeat(5,1fr);gap:12px;perspective:900px;padding-bottom:10vh}
.mk{position:relative;aspect-ratio:1209/755;background:#fff;border:1px solid var(--line);border-radius:10px;overflow:hidden;cursor:zoom-in;will-change:transform;z-index:1}
.mk .art{position:absolute;inset:0;background-image:url(media/logos-wall.png);background-repeat:no-repeat;transform-origin:center;will-change:transform}
.mk .capn{position:absolute;left:0;right:0;bottom:0;padding:6px 8px;font-family:var(--mono);font-size:.5rem;letter-spacing:.12em;text-transform:uppercase;color:#777;background:linear-gradient(transparent,rgba(255,255,255,.94));opacity:0;transition:opacity .3s;pointer-events:none}
.mk.hov{box-shadow:0 24px 70px rgba(16,16,19,.28);border-color:#c9c4ba}
.mk.hov .capn{opacity:1}
.lb{position:fixed;inset:0;z-index:200;background:rgba(16,16,19,.9);backdrop-filter:blur(10px);display:none;align-items:center;justify-content:center;cursor:zoom-out}
.lb.open{display:flex}
.lb .pane{width:min(86vw,1000px);aspect-ratio:1209/755;background:#fff;border-radius:16px;overflow:hidden;position:relative}
.lb .art{position:absolute;inset:0;background-image:url(media/logos-wall.png);background-repeat:no-repeat}
.lb .name{position:absolute;left:50%;bottom:5vh;transform:translateX(-50%);font-family:var(--mono);font-size:.7rem;letter-spacing:.22em;text-transform:uppercase;color:var(--paper)}

.cap-sec{border-top:1px solid var(--line);padding:8vh 0}
.cap-sec .t{font-family:var(--slab);font-weight:900;text-transform:uppercase;font-size:clamp(1.5rem,4vw,3rem);letter-spacing:-.01em}
.cap-sec .t em{font-style:normal;color:var(--magenta)}
.cap-sec a.mail{display:inline-block;margin-top:16px;font-family:var(--serif);font-size:1.2rem;border-bottom:2px solid var(--magenta);padding-bottom:4px}
.cap-sec .foot{margin-top:44px;font-family:var(--mono);font-size:.66rem;letter-spacing:.16em;text-transform:uppercase;color:#888}

@media (max-width:899px){.marks-grid{grid-template-columns:repeat(2,1fr)}}
</style>
</head>
<body>

<nav class="nav-bar"><div class="in">
  <a href="#" aria-label="David Zachary Creative"><svg viewBox="0 0 68 40" fill="none"><path d="M2 6h18c9 0 15 6 15 14s-6 14-15 14H2V26h16c3 0 5-2 5-6s-2-6-5-6H2V6Z" fill="currentColor"/><path d="M40 6h26v8H54l12 12v6H40v-8h12L40 12V6Z" fill="currentColor"/></svg></a>
  <div class="menu"><a href="#contact">Contact</a></div>
</div></nav>

<header class="hero wrap">
  <div class="k">Identity · Logotypes</div>
  <h1>Marks</h1>
  <p class="tone">Twenty logotypes across pharma, biotech, music, hospitality and culture. Roll over to pop a mark — click to study it.</p>
</header>

<main class="wrap">
  <div class="marks-grid" id="marksGrid"></div>
</main>

<div class="cap-sec wrap" id="contact">
  <div class="t">Let&rsquo;s make something <em>real</em>.</div>
  <a class="mail" href="mailto:hello@davidzachary.co">hello@davidzachary.co</a>
  <div class="foot">© David Zachary Creative</div>
</div>

<div class="lb" id="lb"><div class="pane"><div class="art" id="lbArt"></div></div><div class="name" id="lbName"></div></div>

<script src="motion.min.js"></script>
<script>
/* MARKS wall — pixel-perfect cells from the vector render; Motion card pop */
(function(){
  const IW=7650, IH=4950;
  const V=[781,1991,3201,4409,5620,6829];
  const R=[949,1704,2459,3214,3969];
  const NAMES=['ROUX','Nujaxi','EMPA','Monogram G','Monogram :B','Vineyard','fp','The Hound','Elobixibat','Epana',
    'Lost & Found Music','Preservation Hall','not2wo','Lenvima','UrbanNest','Depth Field','Architects','Telos','Idhifa','TY'];
  const grid=document.getElementById('marksGrid');
  const lb=document.getElementById('lb'), lbArt=document.getElementById('lbArt'), lbName=document.getElementById('lbName');
  function bg(el,c,r){
    const x0=V[c],x1=V[c+1],y0=R[r],y1=R[r+1];
    const bw=x1-x0,bh=y1-y0;
    el.style.backgroundSize=(IW/bw*100)+'% '+(IH/bh*100)+'%';
    el.style.backgroundPosition=(x0/(IW-bw)*100)+'% '+(y0/(IH-bh)*100)+'%';
  }
  const M=window.Motion||{};
  const anim=M.animateMini||M.animate||function(el,kf){for(const k in kf){const v=kf[k];el.style[k]=Array.isArray(v)?v[v.length-1]:v}};
  const POP=[.34,1.56,.64,1], GLIDE=[.16,1,.3,1];
  const cells=[];
  let i=0;
  for(let r=0;r<4;r++)for(let c=0;c<5;c++){
    const k=i++;
    const cell=document.createElement('div');cell.className='mk';
    const art=document.createElement('div');art.className='art';bg(art,c,r);
    const cap=document.createElement('div');cap.className='capn';cap.textContent=NAMES[k];
    cell.appendChild(art);cell.appendChild(cap);
    grid.appendChild(cell);cells.push(cell);
    let tilt='';
    cell.addEventListener('mouseenter',()=>{
      cell.style.zIndex=30;cell.classList.add('hov');
      anim(cell,{transform:'scale(1.6)'},{duration:.55,ease:POP});
      anim(art,{transform:'scale(1.25)'},{duration:.6,ease:GLIDE});
      cells.forEach(o=>{if(o!==cell)anim(o,{opacity:.3,transform:'scale(.96)'},{duration:.4,ease:'ease-out'});});
    });
    cell.addEventListener('mousemove',e=>{
      const rc=cell.getBoundingClientRect();
      const rx=((e.clientY-rc.top)/rc.height-.5)*-7;
      const ry=((e.clientX-rc.left)/rc.width-.5)*7;
      tilt='rotateX('+rx.toFixed(1)+'deg) rotateY('+ry.toFixed(1)+'deg)';
      anim(cell,{transform:'scale(1.6) '+tilt},{duration:.22,ease:'ease-out'});
    });
    cell.addEventListener('mouseleave',()=>{
      cell.classList.remove('hov');
      anim(cell,{transform:'scale(1) rotateX(0deg) rotateY(0deg)'},{duration:.5,ease:POP});
      setTimeout(()=>{cell.style.zIndex=1},480);
      anim(art,{transform:'scale(1)'},{duration:.5,ease:GLIDE});
      cells.forEach(o=>{if(o!==cell)anim(o,{opacity:1,transform:'scale(1)'},{duration:.45,ease:'ease-out'});});
    });
    cell.addEventListener('click',()=>{
      bg(lbArt,c,r);lbName.textContent=NAMES[k];lb.classList.add('open');
      anim(lb.querySelector('.pane'),{transform:['scale(.85)','scale(1)'],opacity:[0,1]},{duration:.5,ease:POP});
    });
  }
  const enter=()=>cells.forEach((cell,k)=>anim(cell,
    {opacity:[0,1],transform:['translateY(22px) scale(.92)','translateY(0px) scale(1)']},
    {duration:.7,delay:k*0.03,ease:GLIDE}));
  if(M.inView) M.inView(grid,()=>{enter();return false;},{margin:'-8% 0px'});
  else enter();
  lb.addEventListener('click',()=>lb.classList.remove('open'));
  addEventListener('keydown',e=>{if(e.key==='Escape')lb.classList.remove('open')});
})();
</script>
</body>
</html>
